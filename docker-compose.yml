# meritforge — local dev stack (Docker-only).
#
#   docker compose up -d db            # start Postgres (main + test DBs)
#   docker compose run --rm backend uv run pytest -v
#   docker compose up backend          # serve API at http://localhost:8000/api/health
#   docker compose up web              # serve the frontend at http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meritforge
      POSTGRES_PASSWORD: meritforge
      POSTGRES_DB: meritforge
    ports:
      - "5432:5432"
    volumes:
      - meritforge_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meritforge -d meritforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://meritforge:meritforge@db:5432/meritforge
      TEST_DATABASE_URL: postgresql://meritforge:meritforge@db:5432/meritforge_test
      JWT_SECRET: dev-secret-change-me
    volumes:
      - ./backend:/app          # live source; venv lives at /opt/venv (outside /app) so it isn't shadowed
    ports:
      - "8000:8000"
    # Migrations run on every startup (idempotent — alembic no-ops once head is
    # reached) so a fresh `docker compose up` on a clean volume ends up with a
    # fully migrated schema with no manual step.
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      # No curl/wget in the python:3.12-slim base image — use stdlib urllib
      # instead of adding an apt layer just for the healthcheck.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:  # added in P3 — same image, runs the Postgres-queue worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      backend:
        # Gate the worker on the backend's healthcheck so the (idempotent)
        # `alembic upgrade head` run by `backend` has already completed —
        # avoids two containers racing to migrate the same schema on cold start.
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://meritforge:meritforge@db:5432/meritforge
      TEST_DATABASE_URL: postgresql://meritforge:meritforge@db:5432/meritforge_test
      JWT_SECRET: dev-secret-change-me
    volumes:
      - ./backend:/app          # live source; venv lives at /opt/venv (outside /app) so it isn't shadowed
    command: uv run python -m app.scripts.run_worker

  web:  # added in P5 — Next.js frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* vars at build time, so this must be a
        # build arg, not just a runtime environment var (also set below for
        # documentation/consistency with the rest of the stack).
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"

volumes:
  meritforge_pgdata:
