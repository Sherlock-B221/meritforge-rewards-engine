databases:
  - name: meritforge-db
    plan: free
    databaseName: meritforge
    user: meritforge

services:
  - name: meritforge-api
    type: web
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Migrations run on every boot (idempotent — alembic no-ops once at head),
    # matching the same approach docker-compose.yml uses locally. Render sets
    # $PORT at runtime; the app must bind to it, not the hardcoded 8000 used
    # in docker-compose.
    #
    # dockerCommand is tokenized without an implicit shell, and only *single*
    # quotes group a token — double quotes are taken as literal characters.
    # The inner command must be single-quoted so `&&` reaches /bin/sh's own
    # parser as one argument instead of being split apart.
    dockerCommand: "/bin/sh -c 'uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meritforge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Update to the frontend's real Vercel domain if it changes (custom
      # domain, project rename, etc.) — CORS in app/main.py allows exactly
      # this one origin.
      - key: FRONTEND_ORIGIN
        value: https://frontend-56i6jhssk-mohanu526-9673s-projects.vercel.app

  - name: meritforge-worker
    type: worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: "uv run python -m app.scripts.run_worker"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meritforge-db
          property: connectionString
