databases:
  - name: meritforge-db
    plan: free
    databaseName: meritforge
    user: meritforge

services:
  - name: meritforge-api
    type: web
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # No dockerCommand override here on purpose: two attempts at expressing
    # "migrate then serve" as a single dockerCommand string both hit the same
    # "not found" (exit 127) from Render's tokenizer, regardless of whether
    # the shell-operator command was double- or single-quoted — so the
    # migrate+serve logic (including reading Render's $PORT) is baked into
    # the image itself as `backend/docker-entrypoint.sh`, the Dockerfile's
    # default CMD. This sidesteps Render's dockerCommand parsing entirely.
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meritforge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Update to the frontend's real Vercel domain if it changes (custom
      # domain, project rename, etc.) — CORS in app/main.py allows exactly
      # this one origin.
      - key: FRONTEND_ORIGIN
        value: https://frontend-sigma-sand-38.vercel.app
      # Render's Background Worker service type has no free instance type
      # (starts at $7/mo) — a separate `meritforge-worker` service (mirroring
      # docker-compose.yml's real separate worker container) silently never
      # got created under the free plan. Run the same worker loop as a
      # background task inside this process instead (see app/main.py's
      # lifespan) so the free tier still gets a fully-working demo. Local
      # dev/docker-compose is unaffected — this defaults to false there.
      - key: RUN_WORKER_INLINE
        value: "true"
